  <style>
    @font-face {
      font-family: 'Instrument Serif';
      src: url('fonts/InstrumentSerif-Italic.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      src: url('fonts/IBMPlexMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --canvas: #F2F2F2;
      --ink:    #0B0B10;
      --indigo: #1A0C6D;
      --grey-03: #666F7C;
      --font-sans:  'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono:  'IBM Plex Mono', ui-monospace, monospace;
      --font-serif: 'Instrument Serif', Georgia, serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--canvas);
      color: var(--ink);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    h1 {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(40px, 6vw, 72px);
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    p { color: var(--grey-03); font-size: 17px; margin-bottom: 28px; letter-spacing: 0.02em; }

    .btn {
      display: inline-flex;
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 12px 20px;
      border-radius: 4px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
    }
    .btn:hover { background: var(--indigo); }

    .tag { font-family: var(--font-mono); font-size: 11px; color: var(--grey-03); margin-top: 40px; letter-spacing: 0.02em; }
  </style>
